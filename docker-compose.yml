# =============================================================================
# pantryPal — Quick Start
# =============================================================================
# Pulls prebuilt images from ghcr.io — no need to clone the full repo or
# build anything. All you need is this file and a .env alongside it:
#
#   curl -O https://raw.githubusercontent.com/palStack-io/pantrypal-core/main/docker-compose.yml
#   curl -O https://raw.githubusercontent.com/palStack-io/pantrypal-core/main/.env.example -o .env
#   # edit .env, then:
#   docker compose up -d
#
# Developing pantryPal itself, or want images built from your own checkout?
# Use docker-compose.dev.yml instead. Deploying via the Portainer web
# editor? Use docker-compose-portainer.yml (no .env file needed there).
# =============================================================================

services:
  # ===================================
  # PostgreSQL Database
  # ===================================
  postgres:
    image: postgres:15-alpine
    container_name: pantrypal-postgres
    environment:
      POSTGRES_DB: pantrypal
      POSTGRES_USER: pantrypal
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pantrypal-network
    # Port exposed only for development/debugging (comment out for production)
    # ports:
    #   - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantrypal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================
  # nginx Reverse Proxy
  # ===================================
  nginx:
    image: ghcr.io/palstack-io/pantrypal-nginx:latest
    container_name: pantrypal-nginx
    ports:
      - "8888:80"
    depends_on:
      - api-gateway
      - web-ui
    networks:
      - pantrypal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ===================================
  # API Gateway
  # ===================================
  api-gateway:
    image: ghcr.io/palstack-io/pantrypal-api-gateway:latest
    container_name: pantrypal-api-gateway
    depends_on:
      - postgres
      - inventory-service
      - lookup-service
    environment:
      # Service URLs
      - INVENTORY_SERVICE_URL=http://inventory-service:8001
      - LOOKUP_SERVICE_URL=http://lookup-service:8002
      - "INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set in .env}"

      # Database (PostgreSQL)
      - DATABASE_URL=postgresql://pantrypal:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@postgres:5432/pantrypal

      # Local file storage (recipe/product/user images)
      - LOCAL_STORAGE_PATH=/app/data/storage

      # Recipe Integration
      - ENABLE_RECIPE_INTEGRATION=true

      # Security
      - "SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}"
      - "ENCRYPTION_SALT=${ENCRYPTION_SALT:?ENCRYPTION_SALT must be set in .env}"

      # Authentication
      # Options: none, api_key_only, full, smart
      - AUTH_MODE=${AUTH_MODE:-full}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}

      # Demo Mode (creates demo accounts on startup)
      - DEMO_MODE=${DEMO_MODE:-false}
      - DEMO_ACCOUNT_PASSWORD=${DEMO_ACCOUNT_PASSWORD:-demo12345}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-admin12345}
      - DEMO_MEALIE_URL=${DEMO_MEALIE_URL:-}
      - DEMO_MEALIE_TOKEN=${DEMO_MEALIE_TOKEN:-}

      # Google Sign-In (optional)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}

      # Generic OIDC / SSO (optional)
      - OIDC_ENABLED=${OIDC_ENABLED:-false}
      - OIDC_PROVIDER_NAME=${OIDC_PROVIDER_NAME:-SSO}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_DISCOVERY_URL=${OIDC_DISCOVERY_URL:-}
      - OIDC_SCOPES=${OIDC_SCOPES:-openid profile email}
      - OIDC_AUTO_LINK=${OIDC_AUTO_LINK:-true}
      - OIDC_AUTO_CREATE=${OIDC_AUTO_CREATE:-true}

      # CORS Configuration
      # Use "*" for development (no credentials) or specify origins like:
      # "http://localhost:8080,http://192.168.1.100:8080,http://your-ip:8080"
      - CORS_ORIGINS=*
      # Email settings (for password reset and notifications)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
      - SMTP_USE_TLS=${SMTP_USE_TLS}
      # Application URL (for email links)
      # Set this to your public-facing domain (e.g., https://pantrypal.palstack.io)
      # If not set, will use the incoming request URL
      - APP_URL=${APP_URL}
    volumes:
      - ./data:/app/data
    networks:
      - pantrypal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ===================================
  # Inventory Service
  # ===================================
  inventory-service:
    image: ghcr.io/palstack-io/pantrypal-inventory:latest
    container_name: pantrypal-inventory-service
    environment:
      - DATABASE_URL=postgresql://pantrypal:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@postgres:5432/pantrypal
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set in .env}
      - BACKUP_ENABLED=false
      - BACKUP_SCHEDULE=0 2 * * *
      - BACKUP_RETENTION_DAYS=7
      - BACKUP_PATH=/app/backups/csv
    volumes:
      - ./backups:/app/backups
    networks:
      - pantrypal-network
    restart: unless-stopped

  # ===================================
  # Lookup Service
  # ===================================
  lookup-service:
    image: ghcr.io/palstack-io/pantrypal-lookup:latest
    container_name: pantrypal-lookup-service
    environment:
      - DATABASE_URL=postgresql://pantrypal:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@postgres:5432/pantrypal
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set in .env}
      - CACHE_TTL_DAYS=30
    networks:
      - pantrypal-network
    restart: unless-stopped

  # ===================================
  # Backup Service
  # ===================================
  backup:
    image: ghcr.io/palstack-io/pantrypal-backup:latest
    container_name: pantrypal-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Set to true to enable automated backups
      - DB_BACKUP_ENABLED=${DB_BACKUP_ENABLED:-false}
      # Cron schedule (default: daily at 2 AM)
      - DB_BACKUP_SCHEDULE=${DB_BACKUP_SCHEDULE:-0 2 * * *}
      # Days to retain backups before cleanup
      - DB_BACKUP_RETENTION_DAYS=${DB_BACKUP_RETENTION_DAYS:-7}
      # Set to true to run a backup immediately on container start
      - BACKUP_ON_START=${BACKUP_ON_START:-false}
      # PostgreSQL credentials
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=pantrypal
      - POSTGRES_DB=pantrypal
      # Backup output path (inside container)
      - BACKUP_PATH=/backups
      - LOCAL_STORAGE_PATH=/app/data/storage
    volumes:
      - ./backups:/backups
      - ./data:/app/data:ro
    networks:
      - pantrypal-network
    restart: unless-stopped

  # ===================================
  # Web UI (React Dashboard)
  # ===================================
  web-ui:
    image: ghcr.io/palstack-io/pantrypal-web:latest
    container_name: pantrypal-web-ui
    environment:
      - NODE_ENV=production
    networks:
      - pantrypal-network
    restart: unless-stopped

networks:
  pantrypal-network:
    driver: bridge

volumes:
  postgres_data:
